name: Publish

# Publishes the `statemachine` library to GitHub Packages.
#
# - Publishing a GitHub Release (recommended) builds and pushes automatically,
#   using the release's tag (e.g. v1.2.0) as the artifact version.
# - workflow_dispatch lets you trigger a manual publish (e.g. re-publish a
#   SNAPSHOT) and takes the version as an input.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.2.0 or 1.2.0-SNAPSHOT)"
        required: true
        default: "0.1.0-SNAPSHOT"

permissions:
  contents: read
  packages: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK from mise.toml
        uses: jdx/mise-action@v2

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            # Strip a leading "v" from tags like v1.2.0 -> 1.2.0
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to GitHub Packages
        run: ./gradlew :statemachine:publish -Pversion=${{ steps.version.outputs.value }} --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
